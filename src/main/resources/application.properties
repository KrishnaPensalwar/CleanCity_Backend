spring.application.name=CleanCityBackend
server.address=0.0.0.0
server.port=${PORT:8080}

# Optional local .env file (ignored in containers if not present)
spring.config.import=optional:file:.env

# Neon PostgreSQL (JDBC). Set DATABASE_URL with sslmode=require, e.g.:
# jdbc:postgresql://HOST:5432/DATABASE?sslmode=require
# No hardcoded host/credentials — Render DB is no longer used.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Flyway
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}

spring.flyway.enabled=false
# First Neon bootstrap default: update (create/update schema from entities).
# For production, set JPA_DDL_AUTO=validate (and prefer Flyway migrations).
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

spring.flyway.locations=classpath:db/migration

# JWT (required in production — set JWT_SECRET on the host)
# Must be >= 32 bytes. Prefer: openssl rand -base64 32
app.jwtSecret=${JWT_SECRET}
app.jwtExpirationMs=${JWT_EXPIRATION_MS:900000}
app.jwtRefreshExpirationMs=${JWT_REFRESH_EXPIRATION_MS:604800000}

# CORS — comma-separated browser origins (leave empty for mobile-only / API clients)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Dev smoke endpoint (requires auth). Keep false in production.
app.expose-test-endpoint=${EXPOSE_TEST_ENDPOINT:false}

# Multipart
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# AWS S3
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME}
aws.region=${AWS_REGION:ap-south-1}
aws.access-key-id=${AWS_ACCESS_KEY_ID}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY}

# Firebase — JSON credentials as env var or optional local file path
firebase.service-account.json=${FIREBASE_SERVICE_ACCOUNT_JSON:}
firebase.service-account.path=${FIREBASE_SERVICE_ACCOUNT_PATH:}

# Google Cloud Vision — JSON credentials as env var (falls back to Firebase JSON if unset)
google.application.credentials.json=${GOOGLE_APPLICATION_CREDENTIALS_JSON:}
