spring.application.name=CleanCityBackend
server.address=0.0.0.0
server.port=${PORT:8080}

# Optional local .env file (ignored on Render if not present)
spring.config.import=optional:file:.env

# Database (set DB_URL, DB_USERNAME, DB_PASSWORD in Render or local .env)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Flyway
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create

spring.flyway.locations=classpath:db/migration

# JWT (required in production — set JWT_SECRET on Render)
app.jwtSecret=${JWT_SECRET}
app.jwtExpirationMs=${JWT_EXPIRATION_MS:900000}
app.jwtRefreshExpirationMs=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Multipart
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# AWS S3
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME}
aws.region=${AWS_REGION:ap-south-1}
aws.access-key-id=${AWS_ACCESS_KEY_ID}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY}

# Firebase — JSON credentials as env var (Render) or optional local file path
firebase.service-account.json=${FIREBASE_SERVICE_ACCOUNT_JSON:}
firebase.service-account.path=${FIREBASE_SERVICE_ACCOUNT_PATH:}

# Google Cloud Vision — JSON credentials as env var (falls back to Firebase JSON if unset)
google.application.credentials.json=${GOOGLE_APPLICATION_CREDENTIALS_JSON:}
