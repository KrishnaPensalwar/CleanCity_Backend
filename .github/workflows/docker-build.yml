```yaml
name: Build and Push Backend to Cloudflare

on:
  push:
    branches:
      - cloudflare-migration
  workflow_dispatch:

env:
  IMAGE_NAME: cleancity-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Spring Boot JAR
        run: ./gradlew clean bootJar

      - name: Log in to Cloudflare Container Registry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "$CLOUDFLARE_API_TOKEN" | docker login \
            cloudchamber.cloudflare.com \
            --username "$CLOUDFLARE_ACCOUNT_ID" \
            --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t cloudchamber.cloudflare.com/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t cloudchamber.cloudflare.com/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/${{ env.IMAGE_NAME }}:latest \
            .

      - name: Push Docker image
        run: |
          docker push \
            cloudchamber.cloudflare.com/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

          docker push \
            cloudchamber.cloudflare.com/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/${{ env.IMAGE_NAME }}:latest
```
